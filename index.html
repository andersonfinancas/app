body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#1a1a2e;max-width:500px;margin:0 auto;padding-bottom:40px;font-size:16px}
.header{background:#1a1a2e;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:100}

.month-nav{display:flex;align-items:center;justify-content:center;gap:12px}

.year-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;padding:5px 14px;border-radius:12px}
.year-btn.active{background:rgba(255,255,255,.5);font-weight:700}

.top-actions{display:flex;justify-content:center;gap:8px;padding:10px 15px;background:#f0f0f0;flex-wrap:wrap}

.chart-section{padding:15px;background:#f8f9fa;border-bottom:1px solid #eee}

.chart-subtitle{font-size:13px;color:#666;text-align:center;margin-bottom:10px}
.chart{display:flex;align-items:center;justify-content:space-around;height:130px;position:relative}
.chart-zero{position:absolute;left:0;right:0;top:50%;border-top:1px dashed #aaa;z-index:1}
.bar-group{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;height:100%;justify-content:center}
.bar{width:20px;min-height:2px;border-radius:3px 3px 0 0;position:absolute;z-index:2;transition:height .3s}
.bar.positive{background:#27ae60;bottom:50%}
.bar.negative{background:#e74c3c;top:50%;border-radius:0 0 3px 3px}
.bar.current{box-shadow:0 0 0 2px #f39c12}
.bar.future{opacity:.4}
.bar.removed{opacity:.1}
.bar-label{position:absolute;bottom:-18px;font-size:11px;color:#666;z-index:3}
.bar-event{position:absolute;top:2px;font-size:8px;white-space:nowrap;z-index:3;color:#1a1a2e}
.chart-result{text-align:center;margin-top:22px;font-size:15px;font-weight:600}
.chart-legend{display:flex;justify-content:center;gap:15px;margin-top:6px;font-size:13px}
.starting-info{display:flex;justify-content:space-around;padding:10px 15px;background:#f0f8ff;border-bottom:1px solid #eee;font-size:13px}
.starting-info div{text-align:center}
.starting-info .lbl{color:#888;font-size:11px}
.starting-info .val{font-weight:700;font-size:16px}
.summary{padding:15px;border-bottom:1px solid #eee}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary-item{padding:12px;border-radius:10px;background:#f8f9fa}
.summary-item .label{font-size:13px;color:#666}
.summary-item .value{font-size:20px;font-weight:700}
.summary-remaining{grid-column:1/-1;text-align:center;padding:14px;border-radius:10px}
.summary-remaining .value{font-size:26px}
.bg-green{background:#e8f5e9!important}
.bg-yellow{background:#fff8e1!important}
.bg-red{background:#fce4ec!important}
.green{color:#27ae60}
.yellow{color:#f39c12}
.red{color:#e74c3c}
.alert-bar{margin:0 15px 5px;padding:10px;border-radius:8px;font-size:14px;font-weight:500;text-align:center;display:none}
.cat-section{padding:0 15px 10px}
.cat-toggle{font-size:15px;color:#1a1a2e;background:none;border:none;cursor:pointer;font-weight:600;padding:10px 0;width:100%;text-align:left}
.cat-list{margin-top:5px}
.cat-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;border-bottom:1px solid #f0f0f0}
.cat-bar-bg{height:6px;background:#eee;border-radius:3px;margin-top:4px;width:100%}
.cat-bar-fill{height:100%;border-radius:3px;background:#1a1a2e;max-width:100%}
.section{padding:15px}
.section-title{font-size:17px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}

.item.paid{opacity:.5}
.item.paid .item-name{text-decoration:line-through}

.item-check.checked{background:#27ae60;border-color:#27ae60;color:#fff}
.item-info{flex:1;min-width:0}
.item-name{font-size:16px;font-weight:500}
.item-detail{font-size:12px;color:#888;margin-top:2px}
.item-cat{font-size:11px;color:#555;background:#e8e8e8;padding:2px 7px;border-radius:4px;display:inline-block;margin-top:3px}

.item-value.income{color:#27ae60}
.item-value.expense{color:#e74c3c}

.separator{text-align:center;font-size:14px;color:#999;margin:15px 0 10px;padding:8px;border-top:1px solid #eee}
.add-buttons{display:flex;gap:10px;padding:15px}

.add-btn:active{background:#f0f0f0}
.pdf-section{padding:0 15px 15px;display:flex;gap:10px}
.pdf-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;cursor:pointer;background:#1a1a2e;color:#fff;font-weight:600}

.modal{background:#fff;border-radius:14px;padding:24px;width:92%;max-width:420px;max-height:85vh;overflow-y:auto}

.modal label{display:block;margin-bottom:5px;font-size:14px;color:#666;font-weight:600}
.modal input,.modal select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:14px;-webkit-appearance:none;background:#fff}
.modal-buttons{display:flex;gap:10px;margin-top:12px}
.modal-buttons button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.btn-save{background:#1a1a2e;color:#fff}
.btn-cancel{background:#f0f0f0;color:#333}

.toggle{width:52px;height:28px;background:#ddd;border-radius:14px;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}

<button id="removeMonthBtn" class="remove-month-btn" onclick="removeMonth()">🗑️ Remover este mês</button>
<div class="pdf-section">
<button class="pdf-btn" onclick="generatePDF('month')">📄 PDF Mês</button>

function getMonthKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function ensureMonth(ym){
if(!data.months[ym]){
data.months[ym]={revenues:[],expenses:[]};
// Copy recurring from previous month
var parts=ym.split('-');var y=parseInt(parts[0]);var m=parseInt(parts[1]);
var prevYm;
if(m===1){prevYm=(y-1)+'-12'}else{prevYm=y+'-'+String(m-1).padStart(2,'0')}
if(data.months[prevYm]){
data.months[prevYm].revenues.forEach(function(r){
if(r.recurring){data.months[ym].revenues.push({id:genId(),name:r.name,value:r.value,day:r.day,recurring:true,paid:false})}
});
data.months[prevYm].expenses.forEach(function(e){
if(e.recurring&&!e.installment){data.months[ym].expenses.push({id:genId(),name:e.name,value:e.value,day:e.day,category:e.category||'outros',recurring:true,paid:false,installment:null})}
if(e.installment&&e.installment.current<e.installment.total){
data.months[ym].expenses.push({id:genId(),name:e.name,value:e.value,day:e.day,category:e.category||'outros',recurring:false,paid:false,installment:{current:e.installment.current+1,total:e.installment.total}});
}
});
}
saveData();
}
return data.months[ym];
}

function getMonthTotals(ym){
var md=data.months[ym];
if(!md)return{rev:0,exp:0,paid:0,pending:0};
var rev=0,exp=0,paid=0,pending=0;
md.revenues.forEach(function(r){rev+=r.value});
md.expenses.forEach(function(e){exp+=e.value;if(e.paid)paid+=e.value;else pending+=e.value});
return{rev:rev,exp:exp,paid:paid,pending:pending};
}

function fmt(v){return'R$ '+v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}

// NAVIGATION
function setMonth(y,m){curYear=y;curMonth=m;render()}
function prevMonth(){var m=curMonth-1;var y=curYear;if(m<0){m=11;y--}if(data.years.indexOf(y)>=0){setMonth(y,m)}}
function nextMonth(){var m=curMonth+1;var y=curYear;if(m>11){m=0;y++}if(data.years.indexOf(y)>=0){setMonth(y,m)}}
function setYear(y){curYear=y;render()}

// RENDER
function render(){
var ym=getMonthKey(curYear,curMonth);
ensureMonth(ym);
renderHeader();
renderChart();
renderStartingInfo();
renderSummary();
renderAlert();
renderCategories();
renderItems();
renderRemoveBtn();
}

});
nav+='<button class="year-btn add" onclick="addYear()">+</button>';
nav+='<button class="year-btn del" onclick="removeYear()">🗑️</button>';
document.getElementById('yearNav').innerHTML=nav;
}

function renderChart(){
var year=curYear;
var now=new Date();var nowY=now.getFullYear();var nowM=now.getMonth();
var bars='';var maxVal=1;var vals=[];
for(var m=0;m<12;m++){
var ym=getMonthKey(year,m);
var isRemoved=data.removedMonths.indexOf(ym)>=0;
var t=getMonthTotals(ym);
var bal=t.rev-t.exp;
vals.push({bal:bal,removed:isRemoved});
if(!isRemoved&&Math.abs(bal)>maxVal)maxVal=Math.abs(bal);
}
var greenCount=0,redCount=0,totalBal=0;
for(var m=0;m<12;m++){
var ym=getMonthKey(year,m);
var v=vals[m];
var h=Math.round(Math.abs(v.bal)/maxVal*50);
if(h<2&&v.bal!==0)h=2;
var cls=v.bal>=0?'positive':'negative';
var isCurrent=(year===nowY&&m===nowM);
var isFuture=(year>nowY||(year===nowY&&m>nowM));
if(isCurrent)cls+=' current';
if(isFuture)cls+=' future';
if(v.removed)cls+=' removed';
if(!v.removed){if(v.bal>=0)greenCount++;else redCount++;totalBal+=v.bal}
var evt=EVENTS[ym]||'';
var evtHtml=evt?'<div class="bar-event">'+evt+'</div>':'';
var style=v.bal>=0?'height:'+h+'px;bottom:50%':'height:'+h+'px;top:50%';
bars+='<div class="bar-group">'+evtHtml+'<div class="bar '+cls+'" style="'+style+'"></div><div class="bar-label">'+MONTHS_SHORT[m]+'</div></div>';
}
document.getElementById('chartBars').innerHTML=bars;
document.getElementById('chartTitle').textContent='📈 Projeção '+year;
document.getElementById('chartSub').textContent='🟢 '+greenCount+' meses positivos | 🔴 '+redCount+' negativos';
var rc=document.getElementById('chartResult');
rc.textContent='Resultado: '+fmt(totalBal);
rc.className='chart-result '+(totalBal>=0?'green':'red');
}

function renderSummary(){

var pct=t.rev>0?Math.round(t.exp/t.rev*100):0;

if(sobra>500){sobraClass='green';sobraBg='bg-green'}
else if(sobra>=0){sobraClass='yellow';sobraBg='bg-yellow'}
else{sobraClass='red';sobraBg='bg-red'}
document.getElementById('summarySection').innerHTML=
'<div class="summary-grid">'+
'<div class="summary-item"><div class="label">💵 Receita</div><div class="value green">'+fmt(t.rev)+'</div></div>'+

'<div class="summary-item"><div class="label">⏳ Pendente</div><div class="value">'+fmt(t.pending)+'</div></div>'+

function renderAlert(){
var ym=getMonthKey(curYear,curMonth);

var el=document.getElementById('alertBar');
if(t.rev===0){el.style.display='none';return}
var pct=Math.round(t.exp/t.rev*100);
if(pct>=100){el.style.display='block';el.className='alert-bar bg-red';el.textContent='🚨 ESTOUROU! Gastou mais do que ganha!'}
else if(pct>=95){el.style.display='block';el.className='alert-bar bg-red';el.textContent='🔴 PERIGO! '+pct+'% da renda — sobram apenas '+fmt(t.rev-t.exp)}
else if(pct>=85){el.style.display='block';el.className='alert-bar bg-yellow';el.textContent='🟠 CUIDADO! '+pct+'% — só gaste o essencial'}
else if(pct>=70){el.style.display='block';el.className='alert-bar bg-yellow';el.textContent='🟡 Atenção: '+pct+'% da renda comprometida'}
else{el.style.display='none'}
}

function addYear(){
var y=prompt('Qual ano adicionar?');
if(!y)return;y=parseInt(y);
if(isNaN(y)||y<2020||y>2040){alert('Ano inválido');return}
if(data.years.indexOf(y)>=0){alert('Ano já existe');return}
data.years.push(y);data.years.sort();
// Create months for the year
for(var m=0;m<12;m++){ensureMonth(getMonthKey(y,m))}
saveData();setYear(y);
}
function removeYear(){
var y=prompt('Qual ano remover?');
if(!y)return;y=parseInt(y);
if(data.years.indexOf(y)<0){alert('Ano não encontrado');return}
if(data.years.length<=1){alert('Precisa ter pelo menos 1 ano');return}
if(!confirm('Remover '+y+' e todos os dados?'))return;
data.years=data.years.filter(function(x){return x!==y});
for(var m=0;m<12;m++){delete data.months[getMonthKey(y,m)]}
saveData();
curYear=data.years[0];curMonth=0;render();
}

function saveNewItem(type,ym){
var name=document.getElementById('mName').value.trim();
var value=parseFloat(document.getElementById('mValue').value);
var day=parseInt(document.getElementById('mDay').value);
if(!name||isNaN(value)||isNaN(day)){alert('Preencha todos os campos');return}
var recurring=document.getElementById('mRecurring').classList.contains('active');
var isInst=document.getElementById('mInstToggle').classList.contains('active');
var cat=document.getElementById('mCat')?document.getElementById('mCat').value:'outros';
var inst=null;
if(isInst&&!recurring){
var ic=parseInt(document.getElementById('mInstCur').value)||1;
var it=parseInt(document.getElementById('mInstTotal').value)||1;
inst={current:ic,total:it};
}
var item={id:genId(),name:name,value:value,day:day,recurring:recurring,paid:false};
if(type==='expense'){item.category=cat;item.installment=inst}
var md=ensureMonth(ym);
if(type==='revenue')md.revenues.push(item);else md.expenses.push(item);
// Propagate recurring or installments to future months
if(recurring){propagateRecurring(item,type,ym)}
if(inst&&inst.current<inst.total){propagateInstallments(item,type,ym)}
saveData();closeModal();render();
}

function saveEditItem(type,id,ym){
var md=data.months[ym];if(!md)return;
var list=type==='revenue'?md.revenues:md.expenses;
var item=list.find(function(x){return x.id===id});
if(!item)return;
item.name=document.getElementById('mName').value.trim();
item.value=parseFloat(document.getElementById('mValue').value);
item.day=parseInt(document.getElementById('mDay').value);
item.recurring=document.getElementById('mRecurring').classList.contains('active');
if(type==='expense'){
item.category=document.getElementById('mCat')?document.getElementById('mCat').value:'outros';
var isInst=document.getElementById('mInstToggle').classList.contains('active');
if(isInst&&!item.recurring){
item.installment={current:parseInt(document.getElementById('mInstCur').value)||1,total:parseInt(document.getElementById('mInstTotal').value)||1};
}else{item.installment=null}
}
saveData();closeModal();render();
}

function propagateRecurring(item,type,fromYm){
var parts=fromYm.split('-');var y=parseInt(parts[0]);var m=parseInt(parts[1]);
for(var i=0;i<24;i++){
m++;if(m>12){m=1;y++}
if(data.years.indexOf(y)<0)continue;
var ym=y+'-'+String(m).padStart(2,'0');
var md=ensureMonth(ym);
var list=type==='revenue'?md.revenues:md.expenses;
var exists=list.find(function(x){return x.name===item.name&&x.recurring});
if(!exists){
var newItem={id:genId(),name:item.name,value:item.value,day:item.day,recurring:true,paid:false};
if(type==='expense'){newItem.category=item.category;newItem.installment=null}
list.push(newItem);
}
}
}

function propagateInstallments(item,type,fromYm){
var parts=fromYm.split('-');var y=parseInt(parts[0]);var m=parseInt(parts[1]);
var cur=item.installment.current;var tot=item.installment.total;
for(var i=cur;i<tot;i++){
m++;if(m>12){m=1;y++}
if(data.years.indexOf(y)<0)continue;
var ym=y+'-'+String(m).padStart(2,'0');
var md=ensureMonth(ym);
var list=type==='revenue'?md.revenues:md.expenses;
var newItem={id:genId(),name:item.name,value:item.value,day:item.day,recurring:false,paid:false};
if(type==='expense'){newItem.category=item.category;newItem.installment={current:i+1,total:tot}}
list.push(newItem);
}
}

// SUGGESTION
function showSuggestion(){
var html='<h3>💡 Sugestão de Distribuição</h3>'+
'<label>💵 Informe sua renda líquida mensal (R$)</label>'+
'<input type="number" id="sugRenda" placeholder="0.00" step="0.01">'+
'<button class="btn-save" style="width:100%;margin-bottom:15px" onclick="calcSuggestion()">Calcular</button>'+
'<div id="sugResult"></div>'+
'<div class="suggestion-note">📌 Baseado na regra <strong>50/30/20</strong>:<br>50% necessidades | 30% desejos | 20% futuro<br><br>Esta é uma referência. Ajuste conforme sua realidade.</div>'+
'<div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">Fechar</button></div>';
document.getElementById('modalContent').innerHTML=html;
document.getElementById('modalOverlay').classList.add('active');
}
function calcSuggestion(){
var renda=parseFloat(document.getElementById('sugRenda').value)||0;
if(renda<=0){alert('Informe a renda');return}
var html='';
CATEGORIES.forEach(function(c){
var pct=SUGGEST[c.id]||0;
if(pct>0){
var val=renda*pct/100;
html+='<div class="suggestion-item"><span>'+c.name+' ('+pct+'%)</span><span><strong>'+fmt(val)+'</strong></span></div>';
}
});
document.getElementById('sugResult').innerHTML=html;
}

// PDF
function generatePDF(mode){
var win=window.open('','_blank');
var css='body{font-family:Arial,sans-serif;padding:20px;color:#333;max-width:800px;margin:0 auto}h1{text-align:center;color:#1a1a2e;border-bottom:2px solid #1a1a2e;padding-bottom:10px}h2{margin-top:20px;color:#1a1a2e}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{padding:8px;text-align:left;border-bottom:1px solid #eee;font-size:14px}th{background:#f8f9fa;font-weight:600}.green{color:#27ae60}.red{color:#e74c3c}.right{text-align:right}.total-row{font-weight:700;border-top:2px solid #333}.footer{margin-top:30px;text-align:center;color:#999;font-size:12px}';
var content='<html><head><style>'+css+'</style></head><body>';
if(mode==='month'){
var ym=getMonthKey(curYear,curMonth);
var md=data.months[ym];
var t=getMonthTotals(ym);
var sobra=t.rev-t.exp;
content+='<h1>💰 FinConsult — Resumo Mensal</h1>';
content+='<h2>'+MONTHS_PT[curMonth]+' / '+curYear+'</h2>';
content+='<table><tr><th>📊 Resumo</th><th class="right">Valor</th></tr>';
content+='<tr><td>Receita</td><td class="right green">'+fmt(t.rev)+'</td></tr>';
content+='<tr><td>Total Contas</td><td class="right red">'+fmt(t.exp)+'</td></tr>';
content+='<tr><td>Pago</td><td class="right">'+fmt(t.paid)+'</td></tr>';
content+='<tr><td>Pendente</td><td class="right">'+fmt(t.pending)+'</td></tr>';
content+='<tr class="total-row"><td>Sobra</td><td class="right '+(sobra>=0?'green':'red')+'">'+fmt(sobra)+'</td></tr></table>';
// Revenues
content+='<h2>💵 Receitas</h2><table><tr><th>Nome</th><th>Dia</th><th class="right">Valor</th><th>Status</th></tr>';
if(md)md.revenues.sort(function(a,b){return a.day-b.day}).forEach(function(r){
content+='<tr><td>'+r.name+'</td><td>'+r.day+'</td><td class="right green">+'+fmt(r.value)+'</td><td>'+(r.paid?'✅':'⏳')+'</td></tr>';
});
content+='</table>';
// Expenses
content+='<h2>📋 Contas</h2><table><tr><th>Nome</th><th>Dia</th><th>Categoria</th><th class="right">Valor</th><th>Status</th></tr>';
if(md)md.expenses.sort(function(a,b){return a.day-b.day}).forEach(function(e){
var cat=CATEGORIES.find(function(x){return x.id===e.category});
var catName=cat?cat.name:(e.category||'');
var instTxt=e.installment?' ('+e.installment.current+'/'+e.installment.total+')':'';
content+='<tr><td>'+e.name+instTxt+'</td><td>'+e.day+'</td><td>'+catName+'</td><td class="right red">-'+fmt(e.value)+'</td><td>'+(e.paid?'✅':'⏳')+'</td></tr>';
});
content+='</table>';
// Category summary
content+='<h2>📊 Por Categoria</h2><table><tr><th>Categoria</th><th class="right">Valor</th><th class="right">%</th></tr>';
if(md){
var cats={};md.expenses.forEach(function(e){var c=e.category||'outros';if(!cats[c])cats[c]=0;cats[c]+=e.value});
var sorted=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
sorted.forEach(function(c){var cat=CATEGORIES.find(function(x){return x.id===c});var pct=t.exp>0?Math.round(cats[c]/t.exp*100):0;
content+='<tr><td>'+(cat?cat.name:c)+'</td><td class="right">'+fmt(cats[c])+'</td><td class="right">'+pct+'%</td></tr>';});
}
content+='</table>';
}else{
// Year PDF
content+='<h1>💰 FinConsult — Resumo Anual</h1>';
content+='<h2>Ano '+curYear+'</h2>';
if(data.settings.startingBalance||data.settings.investments){
content+='<p><strong>Ponto de Partida:</strong> Saldo: '+fmt(data.settings.startingBalance)+' | Reserva: '+fmt(data.settings.emergencyFund)+' | Investido: '+fmt(data.settings.investments)+'</p>';
}
content+='<table><tr><th>Mês</th><th class="right">Receita</th><th class="right">Despesas</th><th class="right">Sobra</th></tr>';
var totalR=0,totalE=0;
for(var m=0;m<12;m++){
var ym=getMonthKey(curYear,m);
if(data.removedMonths.indexOf(ym)>=0)continue;
var t=getMonthTotals(ym);
var sobra=t.rev-t.exp;totalR+=t.rev;totalE+=t.exp;
var evt=EVENTS[ym]?'  '+EVENTS[ym]:'';
content+='<tr><td>'+MONTHS_PT[m]+evt+'</td><td class="right green">'+fmt(t.rev)+'</td><td class="right red">'+fmt(t.exp)+'</td><td class="right '+(sobra>=0?'green':'red')+'">'+fmt(sobra)+'</td></tr>';
}
content+='<tr class="total-row"><td><strong>TOTAL</strong></td><td class="right green">'+fmt(totalR)+'</td><td class="right red">'+fmt(totalE)+'</td><td class="right '+(totalR-totalE>=0?'green':'red')+'">'+fmt(totalR-totalE)+'</td></tr>';
content+='</table>';
// Chart representation
content+='<h2>📈 Gráfico</h2><table><tr><th>Mês</th><th>Resultado</th></tr>';
for(var m=0;m<12;m++){
var ym=getMonthKey(curYear,m);
if(data.removedMonths.indexOf(ym)>=0)continue;
var t=getMonthTotals(ym);var bal=t.rev-t.exp;
var barLen=20;var bar='';
if(bal>=0){bar='🟢 '+'█'.repeat(Math.min(Math.round(bal/1000),barLen))+' +'+fmt(bal)}
else{bar='🔴 '+'█'.repeat(Math.min(Math.round(Math.abs(bal)/1000),barLen))+' '+fmt(bal)}
content+='<tr><td>'+MONTHS_SHORT[m]+'</td><td>'+bar+'</td></tr>';
}
content+='</table>';
}
var now=new Date();
content+='<div class="footer">Gerado em '+now.toLocaleDateString('pt-BR')+' às '+now.toLocaleTimeString('pt-BR')+' — FinConsult</div>';
content+='</body></html>';
win.document.write(content);win.document.close();
setTimeout(function(){win.print()},500);
}

}
init();
</script>
