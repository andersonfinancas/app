function loadData(){

function saveData(){localStorage.setItem('fc_data_v4',JSON.stringify(DATA))}
var DATA=loadData();

function ensureMonth(y,m){
var k=getKey(y,m);
if(!DATA[k]){
DATA[k]={revenues:[],expenses:[]};
// Auto populate from recurring of previous month or defaults
var pk=getKey(m===1?y-1:y,m===1?12:m-1);
if(DATA[pk]){
var pr=DATA[pk].revenues.filter(function(i){return i.rec});
var pe=DATA[pk].expenses.filter(function(i){return i.rec});
DATA[k].revenues=pr.map(function(i){return{name:i.name,value:i.value,day:i.day,rec:true,paid:false,cat:i.cat}});
DATA[k].expenses=pe.map(function(i){return{name:i.name,value:i.value,day:i.day,cat:i.cat,rec:true,paid:false}});
}
saveData();
}
}

function getMonthTotals(y,m){
var k=getKey(y,m);
if(!DATA[k])return{income:0,expense:0,paid:0,pending:0,balance:0};
var inc=0,exp=0,pd=0,pn=0;
(DATA[k].revenues||[]).forEach(function(i){inc+=i.value});
(DATA[k].expenses||[]).forEach(function(i){exp+=i.value;if(i.paid)pd+=i.value;else pn+=i.value});
return{income:inc,expense:exp,paid:pd,pending:pn,balance:inc-exp};
}

vals.push(t.balance);

}

var tdy=today();

var h=Math.max(2,Math.abs(v)/maxAbs*45);
var cls=v>=0?'pos':'neg';
var proj=(!isPast(yr,m)&&!isCurrent(yr,m))?'proj':'';
var cur=isCurrent(yr,m)?'cur':'';
var tdyCls=(yr===tdy.y&&m===tdy.m)?'today':'';
var evtKey=yr+'-'+m;
var evt=EVENTS[evtKey]||'';
html+='<div class="bw '+tdyCls+'">';
if(evt)html+='<div class="bevt">'+evt+'</div>';
html+='<div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;width:100%">';
if(v>=0){
html+='<div style="flex:1;display:flex;align-items:flex-end;width:100%;justify-content:center"><div class="bar pos '+proj+' '+cur+'" style="height:'+h+'px"></div></div>';
html+='<div style="flex:1;width:100%"></div>';
}else{
html+='<div style="flex:1;width:100%"></div>';
html+='<div style="flex:1;display:flex;align-items:flex-start;width:100%;justify-content:center"><div class="bar neg '+proj+' '+cur+'" style="height:'+h+'px"></div></div>';
}
html+='</div>';
html+='<div class="blbl">'+MSHORT[m-1]+'</div>';
html+='</div>';
}
el.innerHTML=html;
document.getElementById('chartTitle').textContent='📈 Projeção '+yr;
var cls2=totalYr>=0?'grn':'red';
document.getElementById('chartSummary').innerHTML='Resultado: <strong class="'+cls2+'">'+fmt(totalYr)+'</strong> | 🟢'+vals.filter(function(v){return v>=0}).length+' meses | 🔴'+vals.filter(function(v){return v<0}).length+' meses';
}

function renderYearNav(){
var el=document.getElementById('yNav');
var html='';
for(var y=2026;y<=2028;y++){
var cls=y===curYear?'act':'';
html+='<button class="'+cls+'" onclick="chgYear('+y+')">'+y+'</button>';
}
el.innerHTML=html;
}

function renderSummary(){
var t=getMonthTotals(curYear,curMonth);
var el=document.getElementById('summary');
var remCls='bg-g',remIcon='🟢',remTxt='Dentro do plano';
if(t.balance<0){remCls='bg-r';remIcon='🔴';remTxt='Estourou a renda!';}
else if(t.balance<500){remCls='bg-y';remIcon='🟡';remTxt='Apertado';}
var pct=t.income>0?Math.round(t.expense/t.income*100):0;
var alertHtml='';
if(pct>=100)alertHtml='<div style="font-size:11px;color:#e74c3c;margin-top:4px">🚨 Gastos ultrapassaram a renda!</div>';
else if(pct>=95)alertHtml='<div style="font-size:11px;color:#e74c3c;margin-top:4px">🔴 PERIGO: 95% da renda comprometida!</div>';
else if(pct>=85)alertHtml='<div style="font-size:11px;color:#f39c12;margin-top:4px">🟠 Cuidado: 85% da renda usada</div>';
else if(pct>=70)alertHtml='<div style="font-size:11px;color:#f39c12;margin-top:4px">🟡 Atenção: 70% da renda comprometida</div>';
el.innerHTML='<div class="summ-grid">'+
'<div class="summ-item"><div class="lb">💵 Receita</div><div class="vl grn">'+fmt(t.income)+'</div></div>'+
'<div class="summ-item"><div class="lb">💸 Total Contas</div><div class="vl red">'+fmt(t.expense)+'</div></div>'+
'<div class="summ-item"><div class="lb">✅ Pago</div><div class="vl">'+fmt(t.paid)+'</div></div>'+
'<div class="summ-item"><div class="lb">⏳ Pendente</div><div class="vl ylw">'+fmt(t.pending)+'</div></div>'+
'<div class="summ-rem '+remCls+'"><div class="lb">'+remIcon+' SOBRA ('+remTxt+')</div><div class="vl" style="font-size:22px">'+fmt(t.balance)+'</div>'+alertHtml+'</div>'+
'</div>';
}

function renderRevenues(){
var k=getKey(curYear,curMonth);
ensureMonth(curYear,curMonth);
var items=DATA[k].revenues||[];
var el=document.getElementById('revList');
if(!items.length){el.innerHTML='<div style="text-align:center;color:#999;font-size:12px;padding:10px">Nenhuma receita cadastrada</div>';return}
var html='';
items.forEach(function(item,idx){
var pdCls=item.paid?'pd':'';
var ckCls=item.paid?'ck':'';
html+='<div class="item '+pdCls+'" data-type="revenue" data-idx="'+idx+'">'+
'<div class="ichk '+ckCls+'" onclick="event.stopPropagation();togglePaid(\'revenue\','+idx+')">'+(item.paid?'✓':'')+'</div>'+
'<div class="iinfo"><div class="iname">'+item.name+'</div><div class="idet">Dia '+item.day+(item.rec?' • 🔄 Recorrente':'')+'</div></div>'+
'<div class="ival inc">+'+fmt(item.value)+'</div>'+
'<div class="iact"><button onclick="event.stopPropagation();editItem(\'revenue\','+idx+')">✏️</button><button onclick="event.stopPropagation();deleteItem(\'revenue\','+idx+')">🗑️</button></div>'+
'</div>';
});
el.innerHTML=html;
}

function renderExpenses(){
var k=getKey(curYear,curMonth);
ensureMonth(curYear,curMonth);
var items=DATA[k].expenses||[];
var pending=items.filter(function(i){return!i.paid}).sort(function(a,b){return a.day-b.day});
var paid=items.filter(function(i){return i.paid}).sort(function(a,b){return a.day-b.day});
var elP=document.getElementById('expPending');
var elPd=document.getElementById('expPaid');
var elSec=document.getElementById('paidSection');
function renderList(list,target,isPaid){
if(!list.length){target.innerHTML='<div style="text-align:center;color:#999;font-size:12px;padding:10px">'+(isPaid?'Nenhuma conta paga ainda':'Todas as contas pagas! 🏆')+'</div>';return}
var html='';
list.forEach(function(item){
var realIdx=-1;
for(var i=0;i<items.length;i++){if(items[i]===item){realIdx=i;break}}
var pdCls=item.paid?'pd':'';
var ckCls=item.paid?'ck':'';
html+='<div class="item '+pdCls+'">'+
'<div class="ichk '+ckCls+'" onclick="event.stopPropagation();togglePaid(\'expense\','+realIdx+')">'+(item.paid?'✓':'')+'</div>'+
'<div class="iinfo"><div class="iname">'+item.name+'</div><div class="idet">Dia '+item.day+' • '+item.cat+(item.rec?' • 🔄':'')+'</div></div>'+
'<div class="ival exp">-'+fmt(item.value)+'</div>'+
'<div class="iact"><button onclick="event.stopPropagation();editItem(\'expense\','+realIdx+')">✏️</button><button onclick="event.stopPropagation();deleteItem(\'expense\','+realIdx+')">🗑️</button></div>'+
'</div>';
});
target.innerHTML=html;
}
renderList(pending,elP,false);
renderList(paid,elPd,true);
elSec.style.display=paid.length?'block':'none';
}

function togglePaid(type,idx){
var k=getKey(curYear,curMonth);
var list=type==='revenue'?DATA[k].revenues:DATA[k].expenses;
list[idx].paid=!list[idx].paid;
saveData();
renderAll();
}

function deleteItem(type,idx){
if(!confirm('Excluir este item?'))return;
var k=getKey(curYear,curMonth);
var list=type==='revenue'?DATA[k].revenues:DATA[k].expenses;
list.splice(idx,1);
saveData();
renderAll();
}

function editItem(type,idx){
var k=getKey(curYear,curMonth);
var list=type==='revenue'?DATA[k].revenues:DATA[k].expenses;
var item=list[idx];
openModal(type,item,idx);
}

function openModal(type,item,idx){
var isEdit=typeof idx!=='undefined';
var m=document.getElementById('modal');
var isRev=type==='revenue';
var catHtml='';
if(!isRev){
var cats=['Moradia','Alimentação','Transporte','Educação','Saúde','Dívidas','Lazer','Pessoal','Outros'];
catHtml='<label>Categoria</label><select id="fCat">';
cats.forEach(function(c){catHtml+='<option value="'+c+'"'+(isEdit&&item.cat===c?' selected':'')+'>'+c+'</option>'});
catHtml+='</select>';
}
m.innerHTML='<h3>'+(isEdit?'✏️ Editar':'➕ Nova '+(isRev?'Receita':'Conta'))+'</h3>'+
'<label>Nome</label><input type="text" id="fName" value="'+(isEdit?item.name:'')+'">'+
'<label>Valor (R$)</label><input type="number" id="fVal" step="0.01" value="'+(isEdit?item.value:'')+'">'+
'<label>Dia do mês</label><input type="number" id="fDay" min="1" max="31" value="'+(isEdit?item.day:'')+'">'+
catHtml+
'<div class="tgl-row"><div class="tgl'+(isEdit&&item.rec?' on':'')+'" id="fRec" onclick="this.classList.toggle(\'on\')"></div><span class="tgl-label">🔄 Recorrente (repetir todo mês)</span></div>'+
'<div class="mbtn"><button class="bcn" onclick="closeModal()">Cancelar</button><button class="bsv" onclick="saveModal(\''+type+'\','+(isEdit?idx:-1)+')">Salvar</button></div>'+
(isEdit?'<button class="bdl" style="width:100%" onclick="deleteItem(\''+type+'\','+idx+');closeModal()">🗑️ Excluir</button>':'');
document.getElementById('modalBg').classList.add('act');
}

function closeModal(){document.getElementById('modalBg').classList.remove('act')}

function saveModal(type,idx){
var name=document.getElementById('fName').value.trim();
var val=parseFloat(document.getElementById('fVal').value);
var day=parseInt(document.getElementById('fDay').value);
var rec=document.getElementById('fRec').classList.contains('on');
var cat='';
if(type==='expense'){var cs=document.getElementById('fCat');if(cs)cat=cs.value}
if(!name||isNaN(val)||isNaN(day)){alert('Preencha todos os campos!');return}
var k=getKey(curYear,curMonth);
ensureMonth(curYear,curMonth);
var obj={name:name,value:val,day:day,rec:rec,paid:false};
if(type==='expense')obj.cat=cat;
if(idx>=0){
var list=type==='revenue'?DATA[k].revenues:DATA[k].expenses;
obj.paid=list[idx].paid;
list[idx]=obj;
}else{
if(type==='revenue')DATA[k].revenues.push(obj);
else DATA[k].expenses.push(obj);
}
// If recurring, add to future months that already exist
if(rec&&idx<0){
for(var y=curYear;y<=2028;y++){
for(var mm=1;mm<=12;mm++){
if(y===curYear&&mm<=curMonth)continue;
var fk=getKey(y,mm);
if(DATA[fk]){
var newObj=JSON.parse(JSON.stringify(obj));
newObj.paid=false;
if(type==='revenue')DATA[fk].revenues.push(newObj);
else DATA[fk].expenses.push(newObj);
}
}
}
}
saveData();
closeModal();
renderAll();
}

function chgMonth(dir){
curMonth+=dir;
if(curMonth>12){curMonth=1;curYear++}
if(curMonth<1){curMonth=12;curYear--}
ensureMonth(curYear,curMonth);
renderAll();
}

function chgYear(y){
curYear=y;
ensureMonth(curYear,curMonth);
renderAll();
}

function renderAll(){
document.getElementById('mLabel').textContent=MONTHS[curMonth-1]+' '+curYear;
renderYearNav();
renderChart();
renderSummary();
renderRevenues();
renderExpenses();
}

// Close modal on bg click
document.getElementById('modalBg').addEventListener('click',function(e){
if(e.target===this)closeModal();
});

// Init
ensureMonth(curYear,curMonth);
renderAll();
</script>
</body>
</html>
